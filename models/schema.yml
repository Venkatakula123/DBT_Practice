version: 2

models:
  - name: dim_listings_cleansed
    columns:
      - name: listing_id
        tests:
          - unique
          - not_null

      - name: host_id
        tests:
          - not_null
          - relationships:
              field: host_id
              to: ref('dim_hosts_cleansed')

      - name: room_type
        tests:
          - accepted_values:
              values:
                [
                  "Rent",
                  "Entire home/apt",
                  "Private room",
                  "Shared room",
                  "Hotel room"
                ]

  - name: raw_orders_inc_1
    columns:
      - name: TOTAL_AMOUNT
        tests:
          - positive_value
